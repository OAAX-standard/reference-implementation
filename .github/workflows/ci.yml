name: CI
permissions:
  contents: none
  id-token: none

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ── Build jobs (run in parallel) ────────────────────────────────────────────

  build-runtime-linux:
    name: Build runtime (Linux)
    timeout-minutes: 15
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1
          submodules: recursive
          lfs: true

      - name: Set up environment
        run: sudo bash scripts/setup-env.sh

      - name: Build runtimes (X86_64 + AARCH64)
        run: bash runtime-library/build-runtimes.sh

      - name: Upload X86_64 runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: runtime-linux-x86_64
          path: runtime-library/artifacts/runtime-library-X86_64.tar.gz
          retention-days: 1

      - name: Upload AARCH64 runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: runtime-linux-aarch64
          path: runtime-library/artifacts/runtime-library-AARCH64.tar.gz
          retention-days: 1

      - name: Determine version
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            version=$(cat VERSION)
          else
            version="$GITHUB_HEAD_REF"
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Install s3cmd
        run: sudo apt-get update -y && sudo apt-get install -y s3cmd

      - name: Upload runtimes to S3
        env:
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
        run: |
          s3cmd_flags="--access_key=$S3_ACCESS_KEY --secret_key=$S3_SECRET_KEY --host=$S3_ENDPOINT_URL --host-bucket=%(bucket)s.$S3_ENDPOINT_URL --bucket-location=us-east-1 --ssl"
          # shellcheck disable=SC2086
          s3cmd $s3cmd_flags put "runtime-library/artifacts/runtime-library-X86_64.tar.gz" "s3://oaax/runtimes/${{ env.version }}/CPU/x86_64/Ubuntu/library.tar.gz"
          # shellcheck disable=SC2086
          s3cmd $s3cmd_flags put "runtime-library/artifacts/runtime-library-AARCH64.tar.gz" "s3://oaax/runtimes/${{ env.version }}/CPU/aarch64/Ubuntu/library.tar.gz"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # shellcheck disable=SC2086
            s3cmd $s3cmd_flags put "runtime-library/artifacts/runtime-library-X86_64.tar.gz" "s3://oaax/runtimes/latest/CPU/x86_64/Ubuntu/library.tar.gz"
            # shellcheck disable=SC2086
            s3cmd $s3cmd_flags put "runtime-library/artifacts/runtime-library-AARCH64.tar.gz" "s3://oaax/runtimes/latest/CPU/aarch64/Ubuntu/library.tar.gz"
          fi

  build-runtime-windows:
    name: Build runtime (Windows)
    timeout-minutes: 15
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1
          submodules: recursive
          lfs: true

      - name: Build runtime
        run: |
          cd runtime-library
          .\build-runtime.bat

      - name: Upload Windows runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: runtime-windows-x86_64
          path: runtime-library\artifacts\runtime-library-X86_64-Windows.tar.gz
          retention-days: 1

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -eq "refs/heads/main") {
            $version = Get-Content VERSION
          } else {
            $version = $env:GITHUB_HEAD_REF
          }
          echo "version=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload runtime to S3
        shell: pwsh
        run: |
          $version = $env:version
          $artifactPath = "runtime-library\artifacts\runtime-library-X86_64-Windows.tar.gz"
          $targetKey = "runtimes/$version/CPU/x86_64/Windows/library.tar.gz"
          $latestTargetKey = "runtimes/latest/CPU/x86_64/Windows/library.tar.gz"

          $s5cmdUrl = "https://github.com/peak/s5cmd/releases/download/v2.3.0/s5cmd_2.3.0_Windows-64bit.zip"
          $s5cmdZip = "$env:USERPROFILE\s5cmd.zip"
          $s5cmdPath = "$env:USERPROFILE\s5cmd"
          $expectedSha256 = "9d8a98c1d9f6284c6d54aeec3daeb5f1412fd101850ae756c1e70dd8ffe52166"
          Invoke-WebRequest -Uri $s5cmdUrl -OutFile $s5cmdZip
          $actualSha256 = (Get-FileHash $s5cmdZip -Algorithm SHA256).Hash.ToLower()
          if ($actualSha256 -ne $expectedSha256) {
            throw "s5cmd checksum mismatch: expected $expectedSha256, got $actualSha256"
          }
          Expand-Archive -Path $s5cmdZip -DestinationPath $s5cmdPath -Force
          Remove-Item -Path $s5cmdZip
          $env:PATH += ";$s5cmdPath"

          $env:AWS_ACCESS_KEY_ID = "${{ secrets.S3_ACCESS_KEY }}"
          $env:AWS_SECRET_ACCESS_KEY = "${{ secrets.S3_SECRET_KEY }}"
          s5cmd --endpoint-url "https://${{ secrets.S3_ENDPOINT_URL }}" cp "$artifactPath" "s3://oaax/$targetKey"
          if ("${{ github.ref }}" -eq "refs/heads/main") {
            s5cmd --endpoint-url "https://${{ secrets.S3_ENDPOINT_URL }}" cp "$artifactPath" "s3://oaax/$latestTargetKey"
          }

  build-toolchain:
    name: Build conversion toolchain
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1

      - name: Build Docker image
        run: bash conversion-toolchain/build-toolchain.sh

      - name: Upload toolchain artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: toolchain-image
          path: conversion-toolchain/artifacts/oaax-cpu-toolchain.tar
          retention-days: 1

      - name: Determine version
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            version=$(cat VERSION)
          else
            version="$GITHUB_HEAD_REF"
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Install s3cmd
        run: sudo apt-get update -y && sudo apt-get install -y s3cmd

      - name: Upload toolchain to S3
        env:
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
        run: |
          s3cmd_flags="--access_key=$S3_ACCESS_KEY --secret_key=$S3_SECRET_KEY --host=$S3_ENDPOINT_URL --host-bucket=%(bucket)s.$S3_ENDPOINT_URL --bucket-location=us-east-1 --ssl"
          # shellcheck disable=SC2086
          s3cmd $s3cmd_flags put "conversion-toolchain/artifacts/oaax-cpu-toolchain.tar" "s3://oaax/conversion-toolchain/${{ env.version }}/CPU/oaax-cpu-toolchain.tar"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # shellcheck disable=SC2086
            s3cmd $s3cmd_flags put "conversion-toolchain/artifacts/oaax-cpu-toolchain.tar" "s3://oaax/conversion-toolchain/latest/CPU/oaax-cpu-toolchain.tar"
          fi

  # ── Test jobs (depend on build jobs) ────────────────────────────────────────

  test-stage1:
    name: Stage 1 — conversion tests + model simplification
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    needs: [build-runtime-linux, build-toolchain]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Download runtime artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: runtime-linux-x86_64
          path: /tmp/runtime

      - name: Extract runtime
        run: |
          mkdir -p runtime-library/build
          tar xzf /tmp/runtime/runtime-library-X86_64.tar.gz -C runtime-library/build/

      - name: Download toolchain artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: toolchain-image
          path: /tmp/toolchain

      - name: Load Docker image
        run: |
          docker load -i /tmp/toolchain/oaax-cpu-toolchain.tar
          docker tag "oaax-cpu-toolchain:$(cat VERSION)" oaax-cpu-toolchain:latest

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Set up Python environment
        run: |
          pip install uv
          uv sync --extra integration -q --no-build-package onnxsim
          uv pip install -e conversion-toolchain/ -q

      - name: Stage 1 — conversion tests + model simplification
        run: uv run python tests/stage1.py

      - name: Upload simplified models
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: simplified-models
          path: tests/test_models/simplified/
          retention-days: 1

  test-stage2-x86_64:
    name: Stage 2 — Linux x86_64
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    needs: [build-runtime-linux, test-stage1]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Download runtime artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: runtime-linux-x86_64
          path: /tmp/runtime

      - name: Extract runtime
        run: |
          mkdir -p runtime-library/build
          tar xzf /tmp/runtime/runtime-library-X86_64.tar.gz -C runtime-library/build/

      - name: Download simplified models
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: simplified-models
          path: tests/test_models/simplified

      - name: Install build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q cmake g++

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Set up Python environment
        run: |
          pip install uv
          uv sync --extra integration -q --no-build-package onnxsim
          uv pip install -e conversion-toolchain/ -q

      - name: Stage 2 — runtime benchmark vs ORT
        run: uv run python tests/stage2.py --runs 100 --csv results-linux-x86_64.csv

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: benchmark-results-linux-x86_64
          path: results-linux-x86_64.csv
          if-no-files-found: warn

  test-stage2-arm64:
    name: Stage 2 — Linux arm64
    timeout-minutes: 60
    runs-on: ubuntu-22.04-arm
    needs: [build-runtime-linux, test-stage1]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Download AARCH64 runtime artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: runtime-linux-aarch64
          path: /tmp/runtime

      - name: Extract runtime
        run: |
          mkdir -p runtime-library/build
          tar xzf /tmp/runtime/runtime-library-AARCH64.tar.gz -C runtime-library/build/

      - name: Download simplified models
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: simplified-models
          path: tests/test_models/simplified

      - name: Install build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q cmake g++

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Set up Python environment
        run: |
          pip install uv
          uv sync -q
          uv pip install "numpy>=1.21" "onnxruntime>=1.16" "pytest>=7.0" -q

      - name: Stage 2 — runtime benchmark vs ORT
        run: uv run python tests/stage2.py --runs 100 --csv results-linux-arm64.csv

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: benchmark-results-linux-arm64
          path: results-linux-arm64.csv
          if-no-files-found: warn

  test-stage2-windows:
    name: Stage 2 — Windows x86_64
    timeout-minutes: 30
    runs-on: windows-latest
    needs: [build-runtime-windows, test-stage1]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Download Windows runtime artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: runtime-windows-x86_64
          path: C:\runtime

      - name: Extract runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path runtime-library\build\Release | Out-Null
          tar xzf C:\runtime\runtime-library-X86_64-Windows.tar.gz -C runtime-library\build\Release\

      - name: Download simplified models
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: simplified-models
          path: tests/test_models/simplified

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Set up Python environment
        run: |
          pip install uv
          uv sync --extra integration -q --no-build-package onnxsim
          uv pip install -e conversion-toolchain/ -q

      - name: Stage 2 — runtime benchmark vs ORT
        run: uv run python tests/stage2.py --runs 100 --csv results-windows.csv --skip-ort

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: benchmark-results-windows
          path: results-windows.csv
          if-no-files-found: warn
