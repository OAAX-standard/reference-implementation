name: CI
permissions:
  contents: none
  id-token: none

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  # ── Build jobs (run in parallel) ────────────────────────────────────────────

  build-runtime-linux:
    name: Build runtime (Linux)
    timeout-minutes: 15
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1
          submodules: recursive
          lfs: true

      - name: Set up environment
        run: sudo bash scripts/setup-env.sh

      - name: Build runtimes (X86_64 + AARCH64)
        run: bash runtime-library/build-runtimes.sh

      - name: Upload X86_64 runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: runtime-linux-x86_64
          path: runtime-library/artifacts/runtime-library-X86_64.tar.gz
          retention-days: 1

      - name: Upload AARCH64 runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: runtime-linux-aarch64
          path: runtime-library/artifacts/runtime-library-AARCH64.tar.gz
          retention-days: 1

  build-runtime-windows:
    name: Build runtime (Windows)
    timeout-minutes: 15
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1
          submodules: recursive
          lfs: true

      - name: Build runtime
        run: |
          cd runtime-library
          .\build-runtime.bat

      - name: Upload Windows runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: runtime-windows-x86_64
          path: runtime-library\artifacts\runtime-library-X86_64-Windows.tar.gz
          retention-days: 1

  build-toolchain:
    name: Build conversion toolchain
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1

      - name: Build Docker image
        run: bash conversion-toolchain/build-toolchain.sh

      - name: Upload toolchain artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: toolchain-image
          path: conversion-toolchain/artifacts/oaax-cpu-toolchain.tar
          retention-days: 1

  # ── Test jobs (depend on build jobs) ────────────────────────────────────────

  test-stage1:
    name: Stage 1 — conversion tests + model simplification
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    needs: [build-runtime-linux, build-toolchain]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Download runtime artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: runtime-linux-x86_64
          path: /tmp/runtime

      - name: Extract runtime
        run: |
          mkdir -p runtime-library/build
          tar xzf /tmp/runtime/runtime-library-X86_64.tar.gz -C runtime-library/build/

      - name: Download toolchain artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: toolchain-image
          path: /tmp/toolchain

      - name: Load Docker image
        run: |
          docker load -i /tmp/toolchain/oaax-cpu-toolchain.tar
          docker tag "oaax-cpu-toolchain:$(cat VERSION)" oaax-cpu-toolchain:latest

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Set up Python environment
        run: |
          pip install uv
          uv sync --extra integration -q --no-build-package onnxsim
          uv pip install -e conversion-toolchain/ -q

      - name: Stage 1 — conversion tests + model simplification
        run: uv run python tests/stage1.py

      - name: Upload simplified models
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: simplified-models
          path: tests/test_models/simplified/
          retention-days: 1

  test-stage2-x86_64:
    name: Stage 2 — Linux x86_64
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    needs: [build-runtime-linux, test-stage1]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Download runtime artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: runtime-linux-x86_64
          path: /tmp/runtime

      - name: Extract runtime
        run: |
          mkdir -p runtime-library/build
          tar xzf /tmp/runtime/runtime-library-X86_64.tar.gz -C runtime-library/build/

      - name: Download simplified models
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: simplified-models
          path: tests/test_models/simplified

      - name: Install build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q cmake g++

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Set up Python environment
        run: |
          pip install uv
          uv sync --extra integration -q --no-build-package onnxsim
          uv pip install -e conversion-toolchain/ -q

      - name: Stage 2 — runtime benchmark vs ORT
        run: uv run python tests/stage2.py --runs 100 --csv results-linux-x86_64.csv

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: benchmark-results-linux-x86_64
          path: results-linux-x86_64.csv
          if-no-files-found: warn

  test-stage2-arm64:
    name: Stage 2 — Linux arm64
    timeout-minutes: 60
    runs-on: ubuntu-22.04-arm
    needs: [build-runtime-linux, test-stage1]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Download AARCH64 runtime artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: runtime-linux-aarch64
          path: /tmp/runtime

      - name: Extract runtime
        run: |
          mkdir -p runtime-library/build
          tar xzf /tmp/runtime/runtime-library-AARCH64.tar.gz -C runtime-library/build/

      - name: Download simplified models
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: simplified-models
          path: tests/test_models/simplified

      - name: Install build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q cmake g++

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Set up Python environment
        run: |
          pip install uv
          uv sync -q
          uv pip install "numpy>=1.21" "onnxruntime>=1.16" "pytest>=7.0" -q

      - name: Stage 2 — runtime benchmark vs ORT
        run: uv run python tests/stage2.py --runs 100 --csv results-linux-arm64.csv

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: benchmark-results-linux-arm64
          path: results-linux-arm64.csv
          if-no-files-found: warn

  test-stage2-windows:
    name: Stage 2 — Windows x86_64
    timeout-minutes: 30
    runs-on: windows-latest
    needs: [build-runtime-windows, test-stage1]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Download Windows runtime artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: runtime-windows-x86_64
          path: C:\runtime

      - name: Extract runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path runtime-library\build\Release | Out-Null
          tar xzf C:\runtime\runtime-library-X86_64-Windows.tar.gz -C runtime-library\build\Release\

      - name: Download simplified models
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: simplified-models
          path: tests/test_models/simplified

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Set up Python environment
        run: |
          pip install uv
          uv sync --extra integration -q --no-build-package onnxsim
          uv pip install -e conversion-toolchain/ -q

      - name: Stage 2 — runtime benchmark vs ORT
        run: uv run python tests/stage2.py --runs 100 --csv results-windows.csv --skip-ort

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: benchmark-results-windows
          path: results-windows.csv
          if-no-files-found: warn

  # ── Publish ─────────────────────────────────────────────────────────────────
  # Runs after every build and test passed and uploads the bytes that were tested:
  #   v* tag               -> <VERSION>/ (write once) and latest/, the release
  #   pull request         -> <branch>/ (overwritten on every run, removed when the PR closes), for testing
  #   anything else, or a PR without secrets (fork, Dependabot) -> dry run: files checked, keys printed

  publish:
    name: Publish to the OAAX bucket
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    needs: [test-stage1, test-stage2-x86_64, test-stage2-arm64, test-stage2-windows]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0  # the tag check below needs main's history

      - name: Tag must match VERSION and be on main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [ "${TAG#v}" = "$(cat VERSION)" ] || { echo "tag $TAG does not match VERSION $(cat VERSION)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG is not on main, tag a commit of main"; exit 1; }

      - name: Download the build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts

      - name: Install s3cmd
        run: sudo apt-get update -y && sudo apt-get install -y s3cmd

      - name: Upload to S3
        env:
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
        # The branch name reaches the script only through the environment (GITHUB_HEAD_REF), never through ${{ }}.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            mode=release name=$(cat VERSION)
          elif [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$S3_ACCESS_KEY" ]; then
            mode=branch name=$GITHUB_HEAD_REF
          else
            mode=dry name=$(cat VERSION)
          fi
          bash scripts/publish-artifacts.sh "$mode" "$name" artifacts
